<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión Espacial Webster</title><style>body{margin:0;font-family:Arial;background:radial-gradient(circle at top,#172554,#020617 68%);color:white;min-height:100vh}header{text-align:center;padding:22px}main{max-width:980px;margin:auto;padding:16px}.card{background:#0f172acc;border:1px solid #334155;border-radius:16px;padding:20px;margin:14px 0}.status,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.box,.planet{background:#111827;border:1px solid #475569;border-radius:14px;padding:15px;text-align:center}.icon{font-size:52px}.locked{opacity:.5}.open{box-shadow:0 0 24px #60a5fa55}button{padding:11px 15px;border:0;border-radius:10px;margin:5px;cursor:pointer}.go{background:#2563eb;color:white}.back{background:#e2e8f0}.hidden{display:none}.challenge{background:#172033;padding:16px;border-radius:12px}input{padding:10px;border-radius:8px;border:1px solid #64748b;font-size:17px;width:min(350px,100%)}.good{background:#14532d;padding:10px;border-radius:8px}.bad{background:#7f1d1d;padding:10px;border-radius:8px}.ship{font-size:72px;text-align:center}</style></head><body><header><h1>🚀 Misión Espacial Webster</h1><p>El aprendizaje genera el combustible</p></header><main><div class="card status"><div class="box">Alumno<br><b id="student"></b></div><div class="box">⭐ Puntos<br><b id="points"></b></div><div class="box">⛽ Combustible<br><b id="fuel"></b>%</div></div><div class="card"><div class="ship">🚀</div><p style="text-align:center">Desbloquea planetas con los puntos obtenidos en Webster Aprende.</p></div><div class="grid" id="planets"></div><div class="card hidden" id="mission"><h2 id="mt"></h2><p id="md"></p><div class="challenge"><h3>Reto de navegación</h3><p id="mq"></p><input id="ma"><button class="go" onclick="check()">Responder</button><p id="fb"></p></div></div><div class="card"><button class="back" onclick="location.href='index.html'">⬅ Volver a Webster Aprende</button></div></main><script>let points=Number(localStorage.getItem('websterPuntos'))||0,student=localStorage.getItem('websterUltimoAlumno')||'Explorador Webster',done=JSON.parse(localStorage.getItem('websterMisiones')||'[]'),active=null;const M=[{n:'Luna',i:'🌕',p:30,q:'2³ + 4',a:12,d:'Primera escala: estabiliza la nave.'},{n:'Marte',i:'🔴',p:60,q:'−5 + 12',a:7,d:'Controla operaciones con enteros.'},{n:'Júpiter',i:'🟠',p:100,q:'3/4 + 1/4',a:1,d:'La gravedad exige precisión con fracciones.'},{n:'Saturno',i:'🪐',p:150,q:'0.6 × 0.5',a:.3,d:'Cruza los anillos usando decimales.'},{n:'Neptuno',i:'🔵',p:200,q:'(2³)²',a:64,d:'Misión final: domina potencias.'}];document.getElementById('student').textContent=student;document.getElementById('points').textContent=points;document.getElementById('fuel').textContent=Math.min(100,Math.round(points/2));function render(){let c=document.getElementById('planets');c.innerHTML='';M.forEach((m,k)=>{let open=points>=m.p,ok=done.includes(k),d=document.createElement('div');d.className='planet '+(open?'open':'locked');d.innerHTML='<div class="icon">'+m.i+'</div><h2>'+m.n+'</h2><p>Requiere <b>'+m.p+' puntos</b></p><p>'+(ok?'✅ Completada':open?'🔓 Desbloqueada':'🔒 Bloqueada')+'</p>';let b=document.createElement('button');b.className='go';b.textContent=open?'Iniciar misión':'Necesitas más puntos';b.disabled=!open;b.onclick=()=>start(k);d.appendChild(b);c.appendChild(d)})}render();function start(k){active=k;let m=M[k];document.getElementById('mission').classList.remove('hidden');document.getElementById('mt').textContent=m.i+' Misión: '+m.n;document.getElementById('md').textContent=m.d;document.getElementById('mq').textContent=m.q;document.getElementById('ma').value='';document.getElementById('fb').textContent='';document.getElementById('mission').scrollIntoView({behavior:'smooth'})}function val(v){v=v.trim().replace(',','.');if(v.includes('/')){let p=v.split('/');if(p.length==2&&+p[1]!=0)return +p[0]/+p[1]}let n=Number(v);return isNaN(n)?null:n}function check(){if(active===null)return;let x=val(document.getElementById('ma').value),f=document.getElementById('fb');if(x===null)return;if(Math.abs(x-M[active].a)<1e-7){f.className='good';f.textContent='✅ ¡Misión cumplida!';if(!done.includes(active)){done.push(active);localStorage.setItem('websterMisiones',JSON.stringify(done))}render()}else{f.className='bad';f.textContent='❌ Aún no. Revisa el cálculo e intenta de nuevo.'}}</script></body></html>
